<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Sağlık Günlüğü</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --ok:#059669; --no:#9ca3af;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1115;--card:#171a20;--ink:#e8eaed;--muted:#9aa1ab;--line:#272b33;--accent:#60a5fa;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}
  h1{font-size:19px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{resize:vertical;min-height:62px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .big{display:flex;gap:10px;margin-bottom:4px}
  .big button{flex:1;padding:18px;font-size:17px;font-weight:600;border-radius:12px;
    border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .big button[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
  .big button.no[aria-pressed="true"]{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .scale{display:flex;gap:7px}
  .scale button{flex:1;padding:13px 0;font-size:24px;line-height:1;border:2px solid var(--line);
    border-radius:11px;background:var(--bg);cursor:pointer}
  .scale button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .scale.num button{font-size:16px;font-weight:600;color:var(--ink)}
  details{margin-bottom:12px}
  summary{cursor:pointer;color:var(--muted);font-size:14px;padding:10px 2px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  .save{width:100%;padding:16px;font-size:17px;font-weight:600;border:none;border-radius:12px;
    background:var(--accent);color:#fff;cursor:pointer;margin-top:4px}
  .save:disabled{opacity:.5}
  .msg{text-align:center;font-size:14px;padding:10px;min-height:20px}
  .hist{font-size:14px}
  .hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .hist div:first-child{border-top:none}
  .hist span{color:var(--muted)}
  .hide{display:none}
  .top{display:flex;justify-content:space-between;align-items:center}
  .top button{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<!-- ===== GİRİŞ ===== -->
<section id="auth" class="card">
  <h1>Sağlık Günlüğü</h1>
  <p class="sub">Giriş için e-posta adresine bağlantı gönderilir. Şifre yok.</p>
  <label for="email">E-posta</label>
  <input id="email" type="email" autocomplete="email" placeholder="ornek@mail.com">
  <button class="save" id="sendLink">Giriş bağlantısı gönder</button>
  <p class="msg" id="authMsg"></p>
</section>

<!-- ===== UYGULAMA ===== -->
<main id="app" class="hide">
  <div class="top">
    <div>
      <h1>Sağlık Günlüğü</h1>
      <p class="sub" id="who"></p>
    </div>
    <button id="logout">çıkış</button>
  </div>

  <div class="card">
    <label for="logDate">Tarih</label>
    <input id="logDate" type="date">
  </div>

  <div class="card">
    <label>Akşam yemeği yedim mi?</label>
    <div class="big">
      <button id="dYes" aria-pressed="false">Evet</button>
      <button id="dNo" class="no" aria-pressed="false">Hayır</button>
    </div>
  </div>

  <div class="card hide" id="foodCard">
    <label>Ne yedim?</label>
    <div class="chips" id="foodChips"></div>
    <div class="row" style="margin-top:12px">
      <input id="newFood" placeholder="ekle…">
      <button class="chip" id="addFood" style="flex:0 0 auto;padding:0 18px">+</button>
    </div>
    <div style="margin-top:12px">
      <label for="dinnerTime">Saat</label>
      <input id="dinnerTime" type="time">
    </div>
  </div>

  <div class="card">
    <label>Uyku kalitesi</label>
    <div class="scale" id="sleepScale">
      <button data-v="1" aria-pressed="false">😖</button>
      <button data-v="2" aria-pressed="false">😕</button>
      <button data-v="3" aria-pressed="false">😐</button>
      <button data-v="4" aria-pressed="false">🙂</button>
      <button data-v="5" aria-pressed="false">😴</button>
    </div>
    <div class="row" style="margin-top:14px">
      <div><label for="bedtime">Yattım</label><input id="bedtime" type="time"></div>
      <div><label for="wakeTime">Kalktım</label><input id="wakeTime" type="time"></div>
    </div>
  </div>

  <details>
    <summary>Diğer etkenler (kafein, egzersiz, stres)</summary>
    <div class="card">
      <div class="row">
        <div><label for="caffeine">Kafein (bardak)</label><input id="caffeine" type="number" min="0" max="20" value="0"></div>
        <div><label for="caffeineLast">Son kafein</label><input id="caffeineLast" type="time"></div>
      </div>
      <div style="margin-top:14px">
        <label>Egzersiz yaptım mı?</label>
        <div class="big">
          <button id="eYes" aria-pressed="false">Evet</button>
          <button id="eNo" class="no" aria-pressed="false">Hayır</button>
        </div>
      </div>
      <div style="margin-top:14px">
        <label>Stres düzeyi</label>
        <div class="scale num" id="stressScale">
          <button data-v="1" aria-pressed="false">1</button>
          <button data-v="2" aria-pressed="false">2</button>
          <button data-v="3" aria-pressed="false">3</button>
          <button data-v="4" aria-pressed="false">4</button>
          <button data-v="5" aria-pressed="false">5</button>
        </div>
      </div>
      <div style="margin-top:14px">
        <label for="notes">Not</label>
        <textarea id="notes" placeholder="isteğe bağlı"></textarea>
      </div>
    </div>
  </details>

  <button class="save" id="saveBtn">Kaydet</button>
  <p class="msg" id="saveMsg"></p>

  <div class="card">
    <label>Son 10 gün</label>
    <div class="hist" id="hist"></div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ---- AYAR: kendi değerlerini gir ---- */
const SUPABASE_URL = 'https://fzyadgcwvwsoxsavtyrl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cgQSC1pLSjSBj8gw5KDQoQ_wZ0Kz7VD';
/* ------------------------------------- */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

const DEFAULT_FOODS = ['Çorba','Pilav','Makarna','Et','Tavuk','Balık','Sebze yemeği',
  'Salata','Yoğurt','Peynir','Ekmek','Meyve','Tatlı','Dışarıda'];

let state = { dinner:null, exercise:null, sleep:null, stress:null, foods:new Set() };

/* ---------- gıda chip'leri ---------- */
function foodList(){
  try { return JSON.parse(localStorage.getItem('foods')) || DEFAULT_FOODS; }
  catch { return DEFAULT_FOODS; }
}
function renderChips(){
  const box = $('foodChips');
  box.innerHTML = '';
  for (const f of foodList()){
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = f;
    b.setAttribute('aria-pressed', state.foods.has(f));
    b.onclick = () => {
      state.foods.has(f) ? state.foods.delete(f) : state.foods.add(f);
      b.setAttribute('aria-pressed', state.foods.has(f));
    };
    box.appendChild(b);
  }
}
$('addFood').onclick = () => {
  const v = $('newFood').value.trim();
  if (!v) return;
  const list = foodList();
  if (!list.includes(v)) { list.push(v); localStorage.setItem('foods', JSON.stringify(list)); }
  state.foods.add(v);
  $('newFood').value = '';
  renderChips();
};

/* ---------- ikili / ölçek seçiciler ---------- */
function pair(yesEl, noEl, key){
  const set = v => {
    state[key] = v;
    yesEl.setAttribute('aria-pressed', v === true);
    noEl.setAttribute('aria-pressed', v === false);
    if (key === 'dinner') $('foodCard').classList.toggle('hide', v !== true);
  };
  yesEl.onclick = () => set(state[key] === true ? null : true);
  noEl.onclick  = () => set(state[key] === false ? null : false);
  return set;
}
const setDinner   = pair($('dYes'), $('dNo'), 'dinner');
const setExercise = pair($('eYes'), $('eNo'), 'exercise');

function scale(boxId, key){
  const box = $(boxId);
  const set = v => {
    state[key] = v;
    [...box.children].forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.v) === v));
  };
  [...box.children].forEach(b => {
    b.onclick = () => set(state[key] === Number(b.dataset.v) ? null : Number(b.dataset.v));
  });
  return set;
}
const setSleep  = scale('sleepScale', 'sleep');
const setStress = scale('stressScale', 'stress');

/* ---------- oturum ---------- */
$('sendLink').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return;
  $('sendLink').disabled = true;
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: window.location.href }
  });
  $('authMsg').textContent = error ? 'Hata: ' + error.message : 'Bağlantı gönderildi, e-postana bak.';
  $('sendLink').disabled = false;
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((_e, session) => session ? boot(session) : null);
const { data:{ session } } = await sb.auth.getSession();
if (session) boot(session);

async function boot(session){
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');
  $('who').textContent = session.user.email;
  $('logDate').value = new Date().toLocaleDateString('en-CA');
  renderChips();
  await loadDay();
  await loadHistory();
}

/* ---------- gün yükle / kaydet ---------- */
$('logDate').onchange = loadDay;

async function loadDay(){
  const { data } = await sb.from('health_log').select('*').eq('log_date', $('logDate').value).maybeSingle();
  // formu sıfırla
  state = { dinner:null, exercise:null, sleep:null, stress:null, foods:new Set() };
  ['dinnerTime','bedtime','wakeTime','caffeineLast','notes'].forEach(i => $(i).value = '');
  $('caffeine').value = 0;
  setDinner(null); setExercise(null); setSleep(null); setStress(null);

  if (data){
    setDinner(data.dinner_eaten);
    (data.foods || []).forEach(f => state.foods.add(f));
    $('dinnerTime').value  = data.dinner_time?.slice(0,5) || '';
    setSleep(data.sleep_quality);
    $('bedtime').value     = data.bedtime?.slice(0,5) || '';
    $('wakeTime').value    = data.wake_time?.slice(0,5) || '';
    $('caffeine').value    = data.caffeine_cups ?? 0;
    $('caffeineLast').value= data.caffeine_last?.slice(0,5) || '';
    setExercise(data.exercise);
    setStress(data.stress);
    $('notes').value       = data.notes || '';
  }
  renderChips();
}

$('saveBtn').onclick = async () => {
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return;
  $('saveBtn').disabled = true;

  const row = {
    user_id: user.id,
    log_date: $('logDate').value,
    dinner_eaten: state.dinner === true,
    dinner_time: $('dinnerTime').value || null,
    foods: state.dinner === true ? [...state.foods] : [],
    sleep_quality: state.sleep,
    bedtime: $('bedtime').value || null,
    wake_time: $('wakeTime').value || null,
    caffeine_cups: Number($('caffeine').value) || 0,
    caffeine_last: $('caffeineLast').value || null,
    exercise: state.exercise === true,
    stress: state.stress,
    notes: $('notes').value.trim() || null
  };

  const { error } = await sb.from('health_log').upsert(row, { onConflict: 'user_id,log_date' });
  $('saveMsg').textContent = error ? 'Hata: ' + error.message : 'Kaydedildi ✓';
  setTimeout(() => $('saveMsg').textContent = '', 2500);
  $('saveBtn').disabled = false;
  if (!error) loadHistory();
};

async function loadHistory(){
  const { data } = await sb.from('health_log_v')
    .select('log_date,dinner_eaten,sleep_quality,sleep_hours')
    .order('log_date', { ascending:false }).limit(10);
  const emo = { 1:'😖', 2:'😕', 3:'😐', 4:'🙂', 5:'😴' };
  $('hist').innerHTML = (data || []).map(r => {
    const d = new Date(r.log_date + 'T00:00:00')
      .toLocaleDateString('tr-TR', { day:'numeric', month:'short' });
    const h = r.sleep_hours ? ` · ${r.sleep_hours} sa` : '';
    return `<div><span>${d}</span><span>${r.dinner_eaten ? '🍽️' : '—'} ${emo[r.sleep_quality] || '·'}${h}</span></div>`;
  }).join('') || '<div><span>henüz kayıt yok</span></div>';
}
</script>
</body>
</html>
