name: Yayın sayfaları üret

# Ne zaman çalışır:
on:
  workflow_dispatch:        # "Run workflow" butonuyla elle tetikleme
  schedule:
    - cron: '0 6 * * *'     # her gün 06:00 UTC (Türkiye ~09:00) otomatik

# Actions'ın repoya yazma (commit) izni:
permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sayfaları üret
        run: node build-pages.mjs
        env:
          CI: 'true'

      - name: Değişiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Yayın sayfaları güncellendi [otomatik]"
            git push
          fi
